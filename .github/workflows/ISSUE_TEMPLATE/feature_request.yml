name: Feature Request
description: Suggest a new feature
labels: ["enhancement"]
body:
  
      
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
      placeholder: "Example: I'm frustrated when... / It would be helpful if..."
    validations:
      required: true
      
  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: Describe the solution you'd like to see
      placeholder: "Example: I would like to be able to... / The feature should..."
    validations:
      required: false
      
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, mockups, or examples
    validations:
      required: false
